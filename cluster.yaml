# yaml-language-server: $schema=../.vscode/schemas/eksctl-cluster.json
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: go-web-app-cluster
  region: us-east-1

managedNodeGroups:
  - name: go-web-app-node-group
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3